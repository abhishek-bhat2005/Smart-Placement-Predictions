{% extends "base.html" %}

{% block content %}
<div class="auth-card mx-auto shadow-sm">
  <div class="card border-0">
    <div class="card-body p-5">
      <h2 class="card-title mb-4 text-white">Welcome back</h2>
      <p class="text-muted mb-4">Log in with your email and password to continue.</p>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="mt-4 text-center">
        <span class="text-muted">Need an account?</span>
        <a href="{{ url_for('register') }}">Register here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
